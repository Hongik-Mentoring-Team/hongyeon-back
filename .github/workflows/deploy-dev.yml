name: Java CI with Gradle

on:
  push:
    branches: [ "release-dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Grant for gradlew
        run: chmod +x ./gradlew
        shell: bash

      - name: Generate application.yml
        run: echo "${{secrets.APPLICATION_PROPERTIES}}" > ./src/main/resources/application.yml

      - name: Generate OAuth2 Properties
        run: echo "${{secrets.APPLICATION_OAUTH_PROPERTIES}}" > ./src/main/resources/application-oauth.properties

      - name: Gradle Build
        run: ./gradlew build

      - name: Docker build
        run: |
          
          docker login -u ${{ secrets.SB_DOCKERHUB_USERNAME }} -p ${{ secrets.SB_DOCKERHUB_PASSWORD }}
          docker build -t ${{ secrets.SB_DOCKERHUB_USERNAME }}/hongik-mentor-spring-app:latest .
          docker push ${{ secrets.SB_DOCKERHUB_USERNAME }}/hongik-mentor-spring-app:latest

      - name: Copy docker-compose.yml to EC2
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          scp -i private_key.pem -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.SB_DOCKERHUB_USERNAME }}/hongik-mentor-spring-app:latest
            sudo docker compose up -d
            timeout 60s sudo docker compose logs -f
            sudo docker compose ps
            sudo docker image prune -f
              
